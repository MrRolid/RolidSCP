# cargo-about: licence notices of the libraries built into the binary
# (packaging/build-deb.sh writes them into the .deb copyright file).
# Only what ends up in the Linux binary: no build or dev dependencies.
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# For "A OR B" the first accepted licence in this order is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "0BSD",
    "bzip2-1.0.6",
    "OFL-1.1",
    "GPL-3.0-or-later",
]
