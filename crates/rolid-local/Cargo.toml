[package]
name = "rolid-local"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rolid-text = { path = "../rolid-text" }
async-trait = "0.1.92"
rolid-core = { path = "../rolid-core" }
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
