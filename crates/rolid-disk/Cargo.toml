[package]
name = "rolid-disk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
# JSON of `smartctl -j` and the SMART cache file.
serde_json = "1"
# UDisks2 over D-Bus (already used by the keyring and the accessibility layer).
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"
