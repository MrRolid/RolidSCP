[package]
name = "rolid-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rolid-text = { path = "../rolid-text" }
async-trait = "0.1.92"
thiserror = "2.0.21"
# Comparing a moved file with its source (already in the build: rolid-ui).
blake3 = { version = "1", features = ["pure"] }
tokio = { version = "1.54.1", features = ["io-util", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "time", "macros", "rt", "test-util"] }
